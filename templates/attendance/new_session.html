{% extends "base.html" %}
{% block title %}New Session{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <h1>Start attendance session</h1>
    <form method="post">
      <label>Subject</label>
      <select name="subject_id" required>
        {% for s in subjects %}
        <option value="{{ s.id }}">{{ s.code }} — {{ s.name }}</option>
        {% endfor %}
      </select>
      <label>Class</label>
      <input name="class_name" placeholder="e.g. MCA-1A">
      <label>Date</label>
      <input type="date" name="session_date" value="{{ today }}">
      <div class="btn-row">
        <button class="btn" type="submit">Start</button>
        <a class="btn btn-secondary" href="{{ url_for('attendance.index') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
