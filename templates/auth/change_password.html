{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <div style="text-align:center; margin-bottom: 1.5rem;">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#ffffff" stroke-width="2" style="margin-bottom:0.75rem;"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
      <h1>Change Password</h1>
    </div>
    
    <form method="post">
      <label>Current password</label>
      <div class="password-wrapper">
        <input type="password" name="current_password" required placeholder="Enter current password">
        <button type="button" class="toggle-password"></button>
      </div>
      
      <label>New password</label>
      <div class="password-wrapper">
        <input type="password" name="new_password" required minlength="6" placeholder="Enter new password">
        <button type="button" class="toggle-password"></button>
      </div>
      
      <label>Confirm new password</label>
      <div class="password-wrapper">
        <input type="password" name="confirm_password" required minlength="6" placeholder="Confirm new password">
        <button type="button" class="toggle-password"></button>
      </div>
      
      <div class="btn-row" style="margin-top:1.5rem;">
        <button class="btn" type="submit" style="flex:1;">Update Password</button>
        <a class="btn btn-secondary" href="{{ url_for('dashboard.index') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
