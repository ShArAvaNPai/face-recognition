{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card" style="text-align:center;">
    <div style="margin-bottom: 2rem;">
      <div class="brand-icon" style="width: 48px; height: 48px; margin: 0 auto 1rem; font-size: 1.5rem;">🎓</div>
      <h1>Sign In</h1>
      <p class="subtitle">Smart Attendance System</p>
    </div>
    
    <form method="post" style="text-align:left;">
      <label>Username</label>
      <input type="text" name="username" autofocus required placeholder="Enter your username">
      
      <label>Password</label>
      <div class="password-wrapper">
        <input type="password" name="password" required placeholder="Enter your password">
        <button type="button" class="toggle-password"></button>
      </div>
      
      <div class="btn-row" style="margin-top:2rem;">
        <button class="btn" type="submit" style="width:100%;">Sign In</button>
      </div>
    </form>
    
    <p class="muted" style="margin-top:2rem;">Default admin: <strong>admin / admin123</strong></p>
  </div>
</div>
{% endblock %}
