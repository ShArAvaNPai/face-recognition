{% extends "base.html" %}
{% block title %}{{ 'Edit' if student else 'New' }} Student{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width: 540px;">
  <div class="card">
    <div style="margin-bottom: 2rem; text-align:center;">
      <div class="brand-icon" style="width:48px; height:48px; margin:0 auto 1rem; font-size:1.5rem;">👨‍🎓</div>
      <h1>{{ 'Edit' if student else 'Add' }} Student</h1>
      <p class="subtitle">Student profile and class details</p>
    </div>
    <form method="post">
      <label>Roll Number</label>
      <input name="roll_number" value="{{ student.roll_number if student else '' }}" required placeholder="e.g. CS2023-01">
      
      <label>Full Name</label>
      <input name="name" value="{{ student.name if student else '' }}" required placeholder="Student's full name">
      
      <div style="display:flex; gap:1rem; flex-wrap:wrap;">
        <div style="flex:1; min-width:200px;">
          <label>Department</label>
          <select name="department" required>
            <option value="MCA" {% if student and student.department == 'MCA' %}selected{% endif %}>MCA</option>
            <option value="MBA" {% if student and student.department == 'MBA' %}selected{% endif %}>MBA</option>
          </select>
        </div>
        <div style="flex:1; min-width:200px;">
          <label>Class</label>
          <select name="class_name" required>
            <option value="MCA-1A" {% if student and student.class_name == 'MCA-1A' %}selected{% endif %}>MCA-1A</option>
            <option value="MCA-1B" {% if student and student.class_name == 'MCA-1B' %}selected{% endif %}>MCA-1B</option>
            <option value="MCA-2A" {% if student and student.class_name == 'MCA-2A' %}selected{% endif %}>MCA-2A</option>
            <option value="MBA-1A" {% if student and student.class_name == 'MBA-1A' %}selected{% endif %}>MBA-1A</option>
            <option value="MBA-1B" {% if student and student.class_name == 'MBA-1B' %}selected{% endif %}>MBA-1B</option>
            <option value="MBA-2A" {% if student and student.class_name == 'MBA-2A' %}selected{% endif %}>MBA-2A</option>
          </select>
        </div>
      </div>

      
      <div class="btn-row" style="margin-top:2rem;">
        <button class="btn" type="submit" style="flex:1;">Save Student</button>
        <a class="btn btn-secondary" href="{{ url_for('students.list_students') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
