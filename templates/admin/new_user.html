{% extends "base.html" %}
{% block title %}Create New User{% endblock %}

{% block content %}
<div class="auth-wrap" style="max-width: 600px;">
  <div class="card">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 1.5rem;">Create New User</h1>
      <p class="subtitle">Add a new account to the system</p>
    </div>
    
    <form method="post" action="{{ url_for('admin.new_user') }}">
      <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
        <div style="flex:1; min-width:240px;">
          <label>Username</label>
          <input type="text" name="username" required autofocus placeholder="Unique username">
        </div>
        <div style="flex:1; min-width:240px;">
          <label>Email</label>
          <input type="email" name="email" required placeholder="User email address">
        </div>
      </div>
      
      <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
        <div style="flex:1; min-width:240px;">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" name="password" required minlength="6" placeholder="Secure password">
            <button type="button" class="toggle-password"></button>
          </div>
        </div>
        <div style="flex:1; min-width:240px;">
          <label>Role</label>
          <select name="role" id="role-select" required>
            {% for r in roles %}
            <option value="{{ r }}">{{ r|capitalize }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Student specific fields -->
      <div id="student-fields" style="display: none; animation: fadeIn 0.3s ease;">
        <hr>
        <h3>Student Details</h3>
        <p class="muted">Required for student role accounts</p>
        
        <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
          <div style="flex:1; min-width:240px;">
            <label>Roll Number</label>
            <input type="text" name="roll_number" placeholder="e.g. CS2023-01">
          </div>
          <div style="flex:1; min-width:240px;">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="John Doe">
          </div>
        </div>
        
        <div style="display:flex; gap:1.5rem; flex-wrap:wrap;">
          <div style="flex:1; min-width:240px;">
            <label>Department</label>
            <input type="text" name="department" placeholder="Computer Science">
          </div>
          <div style="flex:1; min-width:240px;">
            <label>Class</label>
            <input type="text" name="class_name" placeholder="MCA-1A">
          </div>
        </div>
      </div>

      <div class="btn-row" style="margin-top:2rem;">
        <button type="submit" class="btn" style="flex:1;">Create User</button>
        <a href="{{ url_for('admin.list_users') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
document.getElementById('role-select').addEventListener('change', function() {
    if(this.value === 'student') {
        document.getElementById('student-fields').style.display = 'block';
    } else {
        document.getElementById('student-fields').style.display = 'none';
    }
});
// trigger on load
document.getElementById('role-select').dispatchEvent(new Event('change'));
</script>
{% endblock %}
